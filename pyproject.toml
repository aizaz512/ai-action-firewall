[project]
name = "ai-action-firewall"
version = "0.1.0"
description = "AI agent action security and risk control platform"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Aizaz Ur Rahman" }
]
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
